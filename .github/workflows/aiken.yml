name: Aiken (cardano/)

on:
  push:
    branches: ["develop", "main"]
    paths: ["cardano/**", ".github/workflows/aiken.yml"]
  pull_request:
    paths: ["cardano/**", ".github/workflows/aiken.yml"]

jobs:
  agent-drep:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cardano/agent_drep
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      - run: aiken fmt --check
      - run: aiken check -D
      - run: aiken build
      - name: Blueprint is up to date
        run: git diff --exit-code -- plutus.json
