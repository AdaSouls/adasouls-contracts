[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.28"
# Measured under both: the osaka profile adds the ModExp repricing (EIP-7883) the Ed25519 verifier pays for.
evm_version = "prague"
remappings = [
  "forge-std/=lib/forge-std/src/",
  # Smooth Crypto Lib imports itself as @solidity/.
  "@solidity/=lib/crypto-lib/src/",
]
fs_permissions = [{ access = "read", path = "./spike" }]

[profile.osaka]
evm_version = "osaka"

[profile.ci]
fuzz = { runs = 1000 }

[fmt]
ignore = ["lib/**"]
